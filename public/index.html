
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Blog</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<!-- Login overlay -->
<div id="login-overlay" class="login-overlay">

    <section class="login-box">
        <h2 id="auth-title">Log in</h2>

        <form id="auth-form">

            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                required
            >

            <button type="submit" id="auth-submit">
                Log in
            </button>

        </form>

        <p id="auth-status" class="status"></p>

        <button type="button" id="auth-toggle" class="secondary-button">
            Need an account? Register
        </button>
    </section>

</div>

<!-- Blog -->
<main id="app" hidden>

    <article class="post">

        <div class="account-bar">
            <span id="current-user"></span>
            <button type="button" id="logout-button">Log out</button>
        </div>

        <h1>My Blog</h1>

        <p>
            Lorem ipsum dolor sit amet, consectetur adipiscing elit.
            Curabitur vitae neque vitae lorem malesuada tincidunt.
            Integer non turpis sed nisl consequat tincidunt.
            Donec vel justo eget nulla consequat tincidunt.
        </p>

    </article>

    <section class="comments">
        <h2>Comments</h2>

        <p id="comments-status" class="status">Loading comments...</p>

        <div id="comments-list"></div>
    </section>

    <section class="comment-form">
        <h2>Leave a comment</h2>

        <form id="comment-form">

            <label for="content">Comment</label>

            <textarea
                id="content"
                rows="4"
                required
            ></textarea>

            <button type="submit">Post comment</button>

            <p id="form-status" class="status"></p>

        </form>
    </section>

</main>

<script src="script.js"></script>

</body>
</html>
